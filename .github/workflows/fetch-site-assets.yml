name: Fetch boulevardsur.com original assets

on:
  push:
    branches:
      - claude/boulevard-sur-3d-scroll-uk662r

permissions:
  contents: write

jobs:
  scrape:
    if: ${{ contains(github.event.head_commit.message, 'fetch-site-assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/boulevard-sur-3d-scroll-uk662r

      - name: Download site bundle assets
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
          mkdir -p site_tmp boulevard-sur/assets/site
          curl -fsSL -A "$UA" https://boulevardsur.com/ -o site_tmp/idx.html
          echo "--- index.html asset refs ---"
          grep -oE '(src|href)="[^"]+"' site_tmp/idx.html | head -50 || true
          # bundles JS/CSS (vite)
          for b in $(grep -oE '"/?assets/[^"]+\.(js|css)' site_tmp/idx.html | tr -d '"' | sed 's#^/##' | sort -u); do
            curl -fsSL -A "$UA" "https://boulevardsur.com/$b" -o "site_tmp/$(basename $b)" || true
          done
          # rutas de imagenes referenciadas en index + bundles
          cat site_tmp/idx.html site_tmp/*.js site_tmp/*.css 2>/dev/null \
            | grep -oE '/?assets/[^"'"'"')( ]+\.(png|jpe?g|webp|svg)' \
            | sed 's#^/##' | sort -u > site_tmp/imgs.txt || true
          echo "--- found $(wc -l < site_tmp/imgs.txt) image refs ---"
          cat site_tmp/imgs.txt
          while read -r p; do
            [ -z "$p" ] && continue
            curl -fsSL -A "$UA" "https://boulevardsur.com/$p" -o "boulevard-sur/assets/site/$(basename "$p")" || true
          done < site_tmp/imgs.txt
          rm -rf site_tmp
          ls -la boulevard-sur/assets/site || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boulevard-sur/assets/site
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add original site assets from boulevardsur.com [site media assets]"
          git push origin claude/boulevard-sur-3d-scroll-uk662r
