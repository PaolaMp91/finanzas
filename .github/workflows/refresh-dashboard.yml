name: Actualizar dashboard PMO desde Teams

# Regenera dashboard.html tomando el archivo de "Seguimiento Semanal" con la
# fecha más cercana a hoy, lo publica en GitHub Pages y guarda el snapshot.
#
# Requiere estos Secrets del repositorio (Settings › Secrets and variables › Actions):
#   AZURE_TENANT_ID · AZURE_CLIENT_ID · AZURE_CLIENT_SECRET
# La app de Azure necesita el permiso de aplicación Sites.Read.All (solo lectura)
# con consentimiento de administrador.

on:
  schedule:
    - cron: '0 12 * * *'          # todos los días 12:00 UTC (06:00 Guatemala)
  workflow_dispatch:              # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches: [ claude/brave-ride-00jkwm ]   # rama por defecto del repo
    paths:
      - 'build_dashboard.py'
      - 'refresh_from_teams.py'
      - 'build_minutas.py'
      - 'minutas_sources.py'
      - 'refresh_minutas.py'
      - 'graph_common.py'
      - 'push_to_planner.py'
      - '.github/workflows/refresh-dashboard.yml'

permissions:
  contents: write                 # para guardar el snapshot regenerado
  pages: write                    # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Regenerar dashboard desde Teams
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::warning::Faltan los Secrets de Azure. Genero vista previa con datos de semilla."
            python3 build_dashboard.py
          else
            python3 refresh_from_teams.py
          fi

      - name: Regenerar Minutas & Acciones
        # Lee minutas de Teams/MeetGeek/Otter (las fuentes sin credenciales se
        # saltan solas) y, si PLANNER_ENABLED=1, crea las tareas en Planner.
        env:
          AZURE_TENANT_ID:         ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:         ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:     ${{ secrets.AZURE_CLIENT_SECRET }}
          GRAPH_MINUTAS_FOLDER_ID: ${{ secrets.GRAPH_MINUTAS_FOLDER_ID }}
          GRAPH_MINUTAS_DRIVE_ID:  ${{ secrets.GRAPH_MINUTAS_DRIVE_ID }}
          MEETGEEK_API_KEY:        ${{ secrets.MEETGEEK_API_KEY }}
          OTTER_EMAIL:             ${{ secrets.OTTER_EMAIL }}
          OTTER_PASSWORD:          ${{ secrets.OTTER_PASSWORD }}
          PLANNER_ENABLED:         ${{ secrets.PLANNER_ENABLED }}
          PLANNER_PLAN_ID:         ${{ secrets.PLANNER_PLAN_ID }}
          PLANNER_BUCKET_ID:       ${{ secrets.PLANNER_BUCKET_ID }}
          PLANNER_ASSIGNEES:       ${{ secrets.PLANNER_ASSIGNEES }}
        run: python3 refresh_minutas.py

      - name: Guardar snapshot si cambió
        run: |
          git config user.name  "pmo-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html minutas.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(pmo): actualizar dashboard y minutas ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sin cambios en dashboard.html/minutas.html"
          fi

      - name: Preparar sitio para Pages
        run: |
          mkdir -p _site
          cp index.html matriz.html brief.html dashboard.html minutas.html _site/ 2>/dev/null || true
          # dashboard PMO como página de inicio del sitio publicado
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
